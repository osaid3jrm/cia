<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>الإنجازات</title>
<style>
body {margin:0; background:black; color:#00ff9d; font-family: monospace; text-align:center; padding:50px; overflow:hidden;}
canvas {position:fixed; top:0; left:0; z-index:-1;}
a {color:#00ff9d; display:inline-block; margin-top:20px; padding:10px 20px; border:1px solid #00ff9d; border-radius:10px; text-decoration:none; transition:0.3s;}
a:hover {background:#00ff9d; color:black; box-shadow:0 0 10px #00ff9d;}
.fade-out {opacity:0; transition: opacity 0.5s;}
</style>
</head>
<body>
<canvas id="matrix"></canvas>

<h1> الإنجازات</h1>
<p>SooN</p>

<a href="index.html">⬅ رجوع</a>
<audio id="clickSound" src="https://www.soundjay.com/button/beep-07.mp3"></audio>

<script>
const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
const letters = "01ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const fontSize = 16;
const columns = canvas.width / fontSize;
const drops = Array(columns).fill(1);
function draw(){ctx.fillStyle="rgba(0,0,0,0.05)";ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle="#00ff9d";ctx.font=fontSize+"px monospace";for(let i=0;i<drops.length;i++){let text=letters[Math.floor(Math.random()*letters.length)];ctx.fillText(text,i*fontSize,drops[i]*fontSize);if(drops[i]*fontSize>canvas.height && Math.random()>0.975)drops[i]=0;drops[i]++;}}
setInterval(draw,33);

const backLink = document.querySelector("a");
const clickSound = document.getElementById("clickSound");
backLink.addEventListener("click", e=>{e.preventDefault(); clickSound.currentTime=0; clickSound.play(); document.body.classList.add("fade-out"); setTimeout(()=>{window.location.href=backLink.getAttribute("href");},500);});
</script>
</body>
</html>
