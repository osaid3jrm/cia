<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>محاولات الاختراق</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
  margin:0;
  background:black;
  color:#00ff9d;
  font-family: monospace;
  overflow:hidden;
  text-align:center;
  padding-top:50px;
}

/* Canvas */
canvas {
  position:fixed;
  top:0;
  left:0;
  z-index:-1;
  width:100%;
  height:100%;
}

/* قائمة المحاولات */
.attemptsList{
  max-width:90%;
  margin:0 auto;
  padding:15px;
  background:rgba(0,0,0,0.6);
  border-radius:15px;
  text-align:right;
  overflow-y:auto;
  max-height:60vh; /* بحيث يكون قابل للتمرير على الجوال */
  box-sizing:border-box;
}

.attempt{
  border-bottom:1px solid #00ff9d40;
  padding:8px 0;
  font-size:14px;
}

.count{
  font-weight:bold;
  color:#ff4d4d;
}

/* عناوين */
h1{
  font-size:1.5em;
  margin-bottom:20px;
}

/* تحسينات للجوال */
@media (max-width:600px){
  .attemptsList{
    max-width:95%;
    padding:10px;
  }
  .attempt{
    font-size:12px;
  }
  h1{
    font-size:1.2em;
  }
}
</style>
</head>
<body>

<canvas id="matrix"></canvas>
<h1>🚨 سجل محاولات الاختراق 🚨</h1>
<div class="attemptsList" id="attemptsList"></div>

<script>
// Matrix Background
const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

window.addEventListener("resize", ()=>{
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});

const letters = "01ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const fontSize = 16;
let columns = Math.floor(canvas.width / fontSize);
const drops = [];
for(let x=0;x<columns;x++) drops[x]=1;

function draw(){
  ctx.fillStyle="rgba(0,0,0,0.05)";
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle="#00ff9d";
  ctx.font=fontSize+"px monospace";
  for(let i=0;i<drops.length;i++){
    let text = letters[Math.floor(Math.random()*letters.length)];
    ctx.fillText(text,i*fontSize,drops[i]*fontSize);
    if(drops[i]*fontSize > canvas.height && Math.random()>0.975) drops[i]=0;
    drops[i]++;
  }
}
setInterval(draw,33);

// عرض المحاولات
const attemptsListDiv = document.getElementById("attemptsList");
let hackAttempts = JSON.parse(localStorage.getItem("hackAttempts")) || [];
hackAttempts.forEach((att,i)=>{
  const div = document.createElement("div");
  div.classList.add("attempt");
  div.innerHTML = `<span class="count">#${i+1}</span> - المستخدم : ${att.user} | المحاولات : ${att.attempts} | الوقت : ${att.time}`;
  attemptsListDiv.appendChild(div);
});
</script>

</body>
</html>
